<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile — HealthPulse</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Fraunces:ital,wght@0,600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #f5f2ee; --card: #fff; --text: #1a1a1a; --muted: #6b7280; --accent: #1d6b4a; --border: #e5e0d8; --radius: 14px; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }
    nav { background: #fff; border-bottom: 1px solid var(--border); padding: .9rem 2rem; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo { font-family: 'Fraunces', serif; font-size: 1.3rem; color: var(--accent); font-weight: 600; }
    .nav-links a { text-decoration: none; color: var(--muted); font-size: .9rem; margin-left: 1.5rem; }
    .nav-links a:hover { color: var(--accent); }
    main { max-width: 600px; margin: 2.5rem auto; padding: 0 1.5rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 2.5rem; }
    h1 { font-family: 'Fraunces', serif; font-size: 1.6rem; margin-bottom: 2rem; }
    .field { margin-bottom: 1.2rem; }
    .label { font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: .3rem; }
    .value { font-size: 1rem; font-weight: 500; }
    .btn { display: inline-block; margin-top: 1.5rem; padding: .7rem 1.5rem; background: var(--accent); color: #fff; border-radius: 8px; text-decoration: none; font-size: .9rem; font-weight: 500; }
  </style>
</head>
<body>
  <nav>
    <div class="nav-logo">HealthPulse</div>
    <div class="nav-links">
      <a href="/dashboard/">Dashboard</a>
      <a href="/accounts/logout/">Logout</a>
    </div>
  </nav>
  <main>
    <div class="card">
      <h1>My Profile</h1>
      <div class="field"><div class="label">Username</div><div class="value">{{ user.username }}</div></div>
      <div class="field"><div class="label">Email</div><div class="value">{{ user.email|default:"—" }}</div></div>
      <div class="field"><div class="label">Phone</div><div class="value">{{ user.phone|default:"—" }}</div></div>
      <div class="field"><div class="label">Date Joined</div><div class="value">{{ user.date_joined|date:"d M Y" }}</div></div>
      <a href="/dashboard/" class="btn">Back to Dashboard</a>
    </div>
  </main>
</body>
</html>
